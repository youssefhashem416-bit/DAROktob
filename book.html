<!DOCTYPE html>

<title>تفاصيل الكتاب - دار اكتب للنشر والتوزيع</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f7f7f7;
    color:#333;
}


/* =========================
   NAVBAR
========================= */

nav{
    background:#a9232b;
    padding:15px;
    text-align:center;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    margin:0 18px;
}

nav a:hover{
    opacity:.85;
}


/* =========================
   PAGE
========================= */

.book-page{
    width:92%;
    max-width:1100px;
    margin:45px auto;
}


/* =========================
   BOOK BOX
========================= */

.book-box,
#error{
    background:#fff;
    border-radius:18px;
    padding:35px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}


/* =========================
   BOOK MAIN
========================= */

.book-main{
    display:flex;
    gap:40px;
    align-items:flex-start;
}


/* =========================
   IMAGE
========================= */

.book-image{
    width:330px;
    flex-shrink:0;
}

.book-image img{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
}


/* =========================
   DETAILS
========================= */

.book-details{
    flex:1;
}

.book-details h1{
    color:#a9232b;
    font-size:40px;
    line-height:1.5;
    margin:10px 0 15px;
}

.author{
    font-size:23px;
    line-height:1.7;
    margin-bottom:20px;
}

.category{
    display:inline-block;
    background:#a9232b;
    color:#fff;
    padding:8px 18px;
    border-radius:25px;
    font-size:17px;
    margin-bottom:25px;
}


/* =========================
   INFO
========================= */

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info-box{
    background:#f8f8f8;
    border-right:4px solid #a9232b;
    padding:15px;
    border-radius:8px;
}

.info-box strong{
    display:block;
    color:#a9232b;
    font-size:17px;
    margin-bottom:6px;
}

.info-box span{
    font-size:17px;
}


/* =========================
   DESCRIPTION
========================= */

.description{
    margin-top:35px;
    padding-top:25px;
    border-top:1px solid #ddd;
}

.description h2{
    color:#a9232b;
    font-size:28px;
}

.description p{
    font-size:19px;
    line-height:2;
}


/* =========================
   BUTTONS
========================= */

.button{
    display:inline-block;

    margin-top:20px;

    background:#a9232b;
    color:#fff;

    text-decoration:none;

    padding:13px 25px;

    border-radius:8px;

    font-size:19px;
    font-weight:bold;

    border:0;

    cursor:pointer;
}

.button:hover{
    background:#8d1d24;
}

.back{
    background:#555;
    margin-right:10px;
}

.back:hover{
    background:#333;
}


/* =========================
   ERROR
========================= */

#error{
    display:none;
    text-align:center;
}

#error h1{
    color:#a9232b;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#a9232b;
    color:#fff;
    text-align:center;
    padding:25px 10px;
    margin-top:50px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    nav a{
        display:inline-block;
        margin:6px 8px;
        font-size:17px;
    }

    .book-page{
        width:94%;
        margin:30px auto;
    }

    .book-box,
    #error{
        padding:20px;
    }

    .book-main{
        display:block;
    }

    .book-image{
        width:100%;
        max-width:330px;
        margin:0 auto 30px;
    }

    .book-details h1{
        font-size:31px;
    }

    .author{
        font-size:19px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .description p{
        font-size:17px;
    }

    .button{
        width:100%;
        text-align:center;
        margin-right:0;
    }

    .back{
        margin-right:0;
    }

}

/* =========================
   GET BOOK NUMBER
========================= */

function getBookNumber(){

var params =
new URLSearchParams(
window.location.search
);

var number =
parseInt(
params.get("book"),
10
);

if(
isNaN(number)
){
return 0;
}

return number;

}


var number =
getBookNumber();

var book =
books[number];


/* =========================
   DISPLAY
========================= */

if(book){

document.getElementById(
"bookContent"
).style.display =
"block";


document.title =
book.title+
" - دار اكتب للنشر والتوزيع";


document.getElementById(
"bookTitle"
).innerHTML =
book.title;


document.getElementById(
"bookAuthor"
).innerHTML =
book.author;


document.getElementById(
"bookCategory"
).innerHTML =
book.category;


document.getElementById(
"bookImage"
).src =
book.image;


document.getElementById(
"bookImage"
).alt =
book.title;


document.getElementById(
"bookPages"
).innerHTML =
book.pages;


document.getElementById(
"bookSize"
).innerHTML =
book.size;


document.getElementById(
"bookYear"
).innerHTML =
book.year;


document.getElementById(
"bookType"
).innerHTML =
book.type;


document.getElementById(
"bookDescription"
).innerHTML =
book.description;


/* =========================
   أهم تعديل
   ربط زر الطلب بالكتاب
========================= */

document.getElementById(
"orderButton"
).href =
"order.html?book="+
number;

}


/* =========================
   INVALID
========================= */

else{

document.getElementById(
"bookContent"
).style.display =
"none";


document.getElementById(
"error"
).style.display =
"block";

}

</script>
